[package]
name = "grit-lib-server"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Server-side storage abstractions for hosting Grit repositories"
repository.workspace = true

[lints]
workspace = true

[features]
default = []
sqlx-postgres = ["dep:sqlx"]

[dependencies]
async-trait.workspace = true
grit-lib = { path = "../grit-lib", version = "0.5" }
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
sqlx = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "rt"] }
