[package]
name = "grit-lib-server"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Server-side storage abstractions for hosting Grit repositories"
repository.workspace = true

[lints]
workspace = true

[features]
default = []
sqlx-postgres = ["dep:sqlx"]
redis = ["dep:redis"]
nats = ["dep:async-nats", "dep:futures-util"]
live-sqlx-postgres-tests = ["sqlx-postgres"]
live-redis-tests = ["redis"]
live-nats-tests = ["nats"]

[dependencies]
async-trait.workspace = true
grit-lib = { path = "../grit-lib", version = "0.5" }
serde.workspace = true
serde_json.workspace = true
flate2.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
sqlx = { workspace = true, optional = true }
redis = { version = "0.32.7", default-features = false, features = ["aio", "tokio-comp", "connection-manager"], optional = true }
async-nats = { version = "0.42", optional = true }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "rt"] }
